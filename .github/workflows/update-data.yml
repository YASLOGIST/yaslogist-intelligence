name: Update CTI Data

on:
  schedule:
    - cron: '0 */2 * * *' # Every 2 hours
  workflow_dispatch:       # Manual trigger

permissions:
  contents: write

concurrency:
  group: cti-data-update
  cancel-in-progress: false

jobs:
  update-cti:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ingest Middle East intel wire, CVEs and target intensity
        run: node update_data.js

      - name: Commit and push updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes in this cycle."
            exit 0
          fi
          git commit -m "chore(data): auto-update Middle East intel wire, CVEs and target intensity"
          git pull origin main --rebase
          git push
